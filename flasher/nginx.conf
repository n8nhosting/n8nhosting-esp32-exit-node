server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # firmware binaries
    location /firmware/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }
    # release index: read cross-origin by the admin dashboard's "Update FW" picker
    location = /firmware/releases.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    # archived releases never change once published
    location /firmware/releases/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /speedtest.bin { default_type application/octet-stream; add_header Cache-Control "no-cache"; }
    location = /manifest.json { default_type application/json; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
