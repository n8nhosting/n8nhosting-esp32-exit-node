server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # firmware binaries
    location /firmware/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json { default_type application/json; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
