<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Server Dashboard</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#283040;
    --fg:#e8edf3; --muted:#8c99ad; --accent:#4b9fff; --ok:#35d6a4; --warn:#ffb020; --bad:#ff5c6c;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  a{color:var(--accent);text-decoration:none}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
  #login .card{width:340px}
  h1{font-size:1.25rem;margin:0 0 4px} .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  input,select,textarea{width:100%;font-family:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:10px 12px;font-size:.95rem;margin-top:4px}
  label{font-size:.8rem;color:var(--muted)}
  button{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.92rem}
  button.sec{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
  button.danger{background:var(--bad)}
  button:hover{filter:brightness(1.08)}
  /* app layout */
  #app{display:none;grid-template-columns:220px 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:1.05rem;padding:6px 10px 16px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:.72rem;margin-top:2px}
  nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
  nav a.active,nav a:hover{background:var(--panel2);color:var(--fg)}
  .spacer{flex:1}
  main{padding:26px 30px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .head h2{margin:0;font-size:1.3rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .stat .k{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:1.7rem;font-weight:700;margin-top:6px}
  .stat .v small{font-size:.9rem;color:var(--muted);font-weight:400}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
  th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600}
  .pill.ok{background:rgba(53,214,164,.15);color:var(--ok)} .pill.bad{background:rgba(255,92,108,.15);color:var(--bad)}
  .pill.warn{background:rgba(255,176,32,.15);color:var(--warn)} .pill.off{background:var(--panel2);color:var(--muted)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
  .row-actions button{padding:5px 10px;font-size:.78rem;margin-left:6px}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;width:380px}
  .modal h3{margin:0 0 14px}
  .modal.wide{width:460px;max-width:94vw}
  .field.inline label{display:flex;gap:8px;align-items:center}
  .field.inline input{width:auto;margin:0}
  button.link{background:none;border:none;padding:0;color:var(--muted);font-weight:400;cursor:pointer;font-size:inherit;text-decoration:underline}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .field{margin-bottom:12px}
  .err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
  .muted{color:var(--muted)} .right{text-align:right}
  .banner{background:rgba(75,159,255,.12);border:1px solid rgba(75,159,255,.35);border-radius:9px;padding:10px 14px;margin-bottom:16px;font-size:.88rem}
  @media(max-width:720px){#app{grid-template-columns:1fr}aside{flex-direction:row;overflow:auto}main{padding:18px}}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h1>Proxy Server</h1>
    <div class="sub">Admin dashboard</div>
    <label>Admin token
      <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
    </label>
    <div style="margin-top:14px"><button id="loginBtn" style="width:100%">Sign in</button></div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand">⚡ Proxy Server<small id="gostuiHost"></small></div>
    <nav>
      <a data-view="overview" class="active">Overview</a>
      <a data-view="users">Users</a>
      <a data-view="devices">Devices</a>
      <a data-view="settings">Settings</a>
    </nav>
    <div class="spacer"></div>
    <a id="flashLink" target="_blank" class="muted" style="padding:9px 12px">⚡ Flash firmware ↗</a>
    <a id="gostuiLink" target="_blank" class="muted" style="padding:9px 12px">GOST config UI ↗</a>
    <a id="logout" class="muted" style="padding:9px 12px">Sign out</a>
  </aside>
  <main>
    <div id="view"></div>
  </main>
</div>

<!-- user modal -->
<div class="modal-bg" id="umodal">
  <div class="modal">
    <h3 id="umTitle">New user</h3>
    <div class="field"><label>Username</label><input id="umUser" /></div>
    <div class="field"><label>Password <span class="muted">(blank = auto-generate)</span></label><input id="umPass" type="text" /></div>
    <div class="field"><label>Rate limit (Mbps, 0 = unlimited)</label><input id="umRate" type="number" value="0" /></div>
    <div class="field"><label>Monthly quota (GB, 0 = unlimited)</label><input id="umQuota" type="number" value="0" /></div>
    <div class="field"><label>Expires in (days, blank = never)</label><input id="umDays" type="number" placeholder="30" /></div>
    <div class="err" id="umErr"></div>
    <div class="right"><button class="sec" onclick="closeModal()">Cancel</button> <button id="umSave">Save</button></div>
  </div>
</div>

<!-- device modal -->
<div class="modal-bg" id="dmodal">
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="dmTitle">
    <h3 id="dmTitle">Edit device</h3>
    <div class="field"><label for="dmName">Name</label><input id="dmName" autocomplete="off" /></div>
    <div class="field"><label for="dmKind">Kind</label>
      <select id="dmKind"><option value="shared">shared</option><option value="dedicated">dedicated</option></select></div>
    <div class="field"><label for="dmSlot">Slot <span class="muted">(blank = none, 1–30)</span></label><input id="dmSlot" type="number" step="1" min="1" max="30" inputmode="numeric" /></div>
    <div class="muted" id="dmPort" style="margin:-6px 0 12px;font-size:.78rem"></div>
    <div class="field"><label for="dmLat">Latitude</label><input id="dmLat" type="number" step="any" min="-90" max="90" /></div>
    <div class="field"><label for="dmLon">Longitude</label><input id="dmLon" type="number" step="any" min="-180" max="180" /></div>
    <div class="muted" id="dmCoordHint" style="margin:-6px 0 12px;font-size:.78rem"></div>
    <div class="field"><label for="dmWifi">WiFi password <span class="muted" id="dmWifiHint"></span></label><input id="dmWifi" type="password" autocomplete="new-password" /></div>
    <div class="field inline"><label for="dmWifiClear"><input id="dmWifiClear" type="checkbox" /> <span id="dmWifiClearLbl"></span></label></div>
    <div class="field"><label for="dmNotes">Notes</label><textarea id="dmNotes" rows="3"></textarea></div>
    <div class="err" id="dmErr" role="alert"></div>
    <div class="right"><button type="button" class="sec" id="dmCancel"></button> <button type="button" id="dmSave"></button></div>
  </div>
</div>

<script>
const i18n = {
  name:'Name', kind:'Kind', location:'Location', wifi:'WiFi', capacity:'Capacity', users:'Users',
  edit:'Edit', reveal:'Reveal', unmeasured:'\u2014 unmeasured', assign:'assign\u2026', change:'change',
  save:'Save', cancel:'Cancel', editDevice:'Edit device', wifiSet:'(set, blank = keep)',
  wifiClear:'Clear stored WiFi password', notSet:'not set', revealFailed:'Reveal failed: ',
  coordHint:'Coordinates cannot be cleared yet; a blank field keeps the current value.',
  mbps:'Mbps', openMap:'Open in OpenStreetMap',
  slot:'Slot', port:'Port', noPort:'none', slotInvalid:'Slot must be blank or a whole number 1\u201330',
  measure:'Measure', measuring:'Measuring\u2026', streamsActive:'streams active', stream1:'stream active', ipGroup:'IP', boards:'boards',
  justNow:'just now', minAgo:'min ago', hAgo:'h ago', dAgo:'d ago', capacityReason:'Capacity: ',
  slotMismatch:'slot not on broker', slotMismatchHint:'The broker routes this board differently from its saved slot/kind. Edit → Save sends it again.'
};
const T = k => i18n[k] ?? k;
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('adm_tok') || '';

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  const ct=r.headers.get('content-type')||'';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if(!r.ok){ const err=new Error((body&&body.error)||('HTTP '+r.status)); err.status=r.status; err.body=body; throw err; }
  return body;
}
function fmtBytes(n){ n=+n||0; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++} return n.toFixed(i?1:0)+' '+u[i]; }
const SLOT_BASE=3130, SLOT_MAX=30;
function slotPort(slot){ slot=+slot; return Number.isInteger(slot)&&slot>=1&&slot<=SLOT_MAX ? SLOT_BASE+slot : 0; }
function fmtAgo(iso){
  const t=Date.parse(iso); if(!iso||isNaN(t)) return '';
  const m=Math.max(0,Math.floor((Date.now()-t)/60000));
  if(m<1) return T('justNow');
  if(m<60) return m+' '+T('minAgo');
  if(m<1440) return Math.floor(m/60)+' '+T('hAgo');
  return Math.floor(m/1440)+' '+T('dAgo');
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- auth ---- */
$('#loginBtn').onclick = async ()=>{
  TOKEN = $('#tok').value.trim();
  try{ await api('/api/overview'); localStorage.setItem('adm_tok',TOKEN); showApp(); }
  catch(e){ $('#loginErr').textContent='Invalid token'; }
};
$('#tok').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#loginBtn').click(); });
$('#logout').onclick = logout;
function logout(){ localStorage.removeItem('adm_tok'); TOKEN=''; $('#app').style.display='none'; $('#login').style.display='flex'; }

function showApp(){
  $('#login').style.display='none';
  $('#app').style.display='grid';
  const gostui = new URLSearchParams(location.search).get('gostui') || localStorage.getItem('gostui') || 'https://gost-ui.jbacteam.com';
  $('#gostuiLink').href = gostui; $('#gostuiHost').textContent = location.hostname;
  const flash = new URLSearchParams(location.search).get('flash') || localStorage.getItem('flash') || (location.protocol+'//'+location.hostname.replace(/^admin\./,'flash.'));
  $('#flashLink').href = flash;
  route('overview');
}

/* ---- navigation ---- */
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active'); route(a.dataset.view);
});
function route(v){ ({overview:viewOverview,users:viewUsers,devices:viewDevices,settings:viewSettings}[v])(); }

/* ---- Overview ---- */
async function viewOverview(){
  $('#view').innerHTML = `<div class="head"><h2>Overview</h2><button class="sec" onclick="route('overview')">Refresh</button></div><div id="ov">Loading…</div>`;
  try{
    const o = await api('/api/overview');
    const b = o.broker||{};
    const online = b.tls ? 'TLS' : 'plain';
    $('#ov').innerHTML = `
      <div class="cards">
        <div class="stat"><div class="k">Users</div><div class="v">${o.users.total} <small>(${o.users.active} active)</small></div></div>
        <div class="stat"><div class="k">Exit devices online</div><div class="v">${b.nodes_online??0} <small>/ ${b.nodes_total??0}</small></div></div>
        <div class="stat"><div class="k">Idle connections</div><div class="v">${b.idle_nodes??0}</div></div>
        <div class="stat"><div class="k">Traffic this month</div><div class="v">${(o.month_gb||0).toFixed(2)} <small>GB</small></div></div>
        <div class="stat"><div class="k">Dials (ok / fail)</div><div class="v">${b.dials_ok??0} <small>/ ${(b.dials_err??0)+(b.dials_no_node??0)}</small></div></div>
        <div class="stat"><div class="k">Over quota / expired</div><div class="v">${o.users.over_quota} <small>/ ${o.users.expired}</small></div></div>
      </div>
      <div class="banner">Broker link: <b>${online}</b> · uptime ${Math.floor((b.uptime_sec||0)/3600)}h · relayed ↑${fmtBytes(b.bytes_up)} ↓${fmtBytes(b.bytes_down)}</div>`;
  }catch(e){ $('#ov').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

/* ---- Users ---- */
// The rendered users by username: row buttons carry only data-user, never the
// user object or the name inside inline script.
let usersByName = new Map();
async function viewUsers(){
  $('#view').innerHTML = `<div class="head"><h2>Users</h2><button type="button" id="newUserBtn">+ New user</button></div>
    <div id="utbl">Loading…</div>`;
  $('#newUserBtn').addEventListener('click',()=>openUser());
  try{
    const [users, devices] = await Promise.all([api('/api/users'), api('/api/devices').catch(()=>[])]);
    usersByName = new Map(users.map(u=>[u.username,u]));
    window._deviceMacs = (devices||[]).map(d=>d.mac);
    window._devByMac = Object.fromEntries((devices||[]).map(d=>[d.mac,d]));
    if(!users.length){ $('#utbl').innerHTML='<p class="muted">No users yet.</p>'; return; }
    const rows = users.map(u=>{
      const quota = u.quota_gb>0 ? `${u.usage_gb.toFixed(2)} / ${u.quota_gb} GB` : `${u.usage_gb.toFixed(2)} GB`;
      const over = u.quota_gb>0 && u.usage_gb>=u.quota_gb;
      const exp = u.expires_at ? new Date(u.expires_at) : null;
      const expired = exp && exp < new Date();
      let st = u.enabled ? '<span class="pill ok">active</span>' : '<span class="pill off">disabled</span>';
      if(expired) st='<span class="pill bad">expired</span>';
      else if(over) st='<span class="pill warn">over quota</span>';
      const dv = (window._devByMac||{})[u.device_mac];
      let devLabel = '';
      if(u.device_mac){
        devLabel = dv && dv.name ? `${esc(dv.name)} <span class="mono muted">(${esc(u.device_mac)})</span>` : `<span class="mono">${esc(u.device_mac)}</span>`;
        const up = dv ? slotPort(dv.slot) : 0;
        if(up) devLabel += ` <span class="mono">\u00b7 :${esc(up)}</span>`;
      }
      const un = esc(u.username);
      const dev = u.device_mac
        ? `${devLabel} <button type="button" class="link" data-act="assign" data-user="${un}">${esc(T('change'))}</button>`
        : `<button type="button" class="link" data-act="assign" data-user="${un}">${esc(T('assign'))}</button>`;
      return `<tr>
        <td class="mono">${un}</td>
        <td>${st}</td>
        <td>${u.rate_mbps>0?u.rate_mbps+' Mbps':'—'}</td>
        <td>${quota}${over?' ⚠':''}</td>
        <td>${exp?exp.toISOString().slice(0,10):'never'}</td>
        <td>${dev}</td>
        <td class="right row-actions">
          <button type="button" data-act="copy" data-user="${un}">Copy conn</button>
          <button type="button" class="sec" data-act="edit" data-user="${un}">Edit</button>
          <button type="button" class="sec" data-act="${u.enabled?'disable':'enable'}" data-user="${un}">${u.enabled?'Disable':'Enable'}</button>
          <button type="button" class="sec" data-act="extend" data-user="${un}">+30d</button>
          <button type="button" class="danger" data-act="delete" data-user="${un}">Delete</button>
        </td></tr>`;
    }).join('');
    $('#utbl').innerHTML = `<table><thead><tr><th>Username</th><th>Status</th><th>Rate</th><th>Usage (this month)</th><th>Expires</th><th>Device</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    $('#utbl').querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',()=>{
      const name=b.dataset.user, act=b.dataset.act;
      if(act==='copy') copyCreds(name);
      else if(act==='edit'){ const u=usersByName.get(name); if(u) openUser(u); }
      else if(act==='assign') assignDevice(name);
      else if(act==='delete') delUser(name);
      else userAction(name,act); // enable | disable | extend
    }));
  }catch(e){ $('#utbl').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

// Copy a ready-to-send connection string (user:pass@host:port) to the clipboard.
async function copyCreds(username){
  try{
    const c = await api('/api/users/'+encodeURIComponent(username)+'/credentials',{method:'POST'});
    const lines = [
      'Proxy (HTTP/SOCKS5):',
      '  host: '+c.host, '  port: '+c.port,
      '  user: '+c.username, '  pass: '+c.password,
      '  '+(c.connection||('<set PROXY_PUBLIC_HOST>')),
      '  HTTP:   '+c.http_url, '  SOCKS5: '+c.socks5_url,
      'Rate: '+(c.rate_mbps>0?c.rate_mbps+' Mbps':'unlimited'),
      'Quota: '+(c.quota_gb>0?c.quota_gb+' GB/mo':'unlimited')+'  (used '+(c.usage_gb||0).toFixed(2)+' GB)',
      'Expires: '+(c.expires_at?new Date(c.expires_at).toLocaleDateString():'never'),
    ].join('\n');
    try{ await navigator.clipboard.writeText(c.connection||lines); }catch(_){}
    alert('Copied connection to clipboard.\n\n'+lines);
  }catch(e){ alert('Error: '+e.message); }
}

async function assignDevice(username){
  const macs = window._deviceMacs||[];
  const hint = macs.length? '\nKnown devices:\n'+macs.join('\n') : '\n(no devices seen yet)';
  const mac = prompt('Assign user "'+username+'" to device MAC (blank = unassign):'+hint, '');
  if(mac===null) return;
  const action = mac.trim()? 'assign' : 'unassign';
  try{
    await api('/api/users/'+encodeURIComponent(username)+'/'+action,{method:'POST',body:JSON.stringify({device_mac:mac.trim()})});
  }catch(e){
    const reason = e.body && e.body.error==='capacity' && e.body.reason ? T('capacityReason')+e.body.reason : e.message;
    showUsersErr(reason); return;
  }
  viewUsers();
}
function showUsersErr(msg){
  let el=$('#uErr');
  if(!el){ el=document.createElement('div'); el.id='uErr'; el.className='err'; el.setAttribute('role','alert'); $('#view').insertBefore(el,$('#view').children[1]||null); }
  el.textContent=msg;
}
let editUser=null;
function openUser(u){
  editUser = u||null;
  $('#umTitle').textContent = u? 'Edit '+u.username : 'New user';
  $('#umUser').value = u?u.username:''; $('#umUser').disabled = !!u;
  $('#umPass').value=''; $('#umPass').placeholder = u?'(unchanged)':'(auto-generate)';
  $('#umRate').value = u?u.rate_mbps:0; $('#umQuota').value = u?u.quota_gb:0; $('#umDays').value='';
  $('#umErr').textContent=''; $('#umodal').style.display='flex';
}
function closeModal(){ $('#umodal').style.display='none'; }
$('#umSave').onclick = async ()=>{
  const body={ rate_mbps:+$('#umRate').value||0, quota_gb:+$('#umQuota').value||0 };
  if($('#umPass').value) body.password=$('#umPass').value;
  const days=$('#umDays').value;
  if(days!=='' ) body.expires_at = new Date(Date.now()+(+days)*864e5).toISOString();
  try{
    if(editUser){ await api('/api/users/'+encodeURIComponent(editUser.username),{method:'PUT',body:JSON.stringify(body)}); }
    else {
      body.username=$('#umUser').value.trim();
      if(!body.username){ $('#umErr').textContent='Username required'; return; }
      const r = await api('/api/users',{method:'POST',body:JSON.stringify(body)});
      if(r.generated_password) alert('User created.\nPassword (shown once): '+r.generated_password);
    }
    closeModal(); viewUsers();
  }catch(e){ $('#umErr').textContent=e.message; }
};
async function userAction(u,a){ const b=a==='extend'?JSON.stringify({days:30}):null;
  await api('/api/users/'+encodeURIComponent(u)+'/'+a,{method:'POST',body:b}); viewUsers(); }
async function delUser(u){ if(!confirm('Delete user '+u+'?'))return; await api('/api/users/'+encodeURIComponent(u),{method:'DELETE'}); viewUsers(); }

/* ---- Devices ---- */
async function viewDevices(){
  $('#view').innerHTML = `<div class="head"><h2>Exit devices (ESP32-S3)</h2><button class="sec" onclick="route('devices')">Refresh</button></div><div id="dtbl">Loading…</div>`;
  try{
    const nodes = await api('/api/devices') || [];
    if(!nodes.length){ $('#dtbl').innerHTML='<p class="muted">No devices have connected yet.</p>'; return; }
    window._devs = Object.fromEntries(nodes.map(n=>[n.mac,n]));
    const rows = nodes.map(n=>{
      let st = n.blocked?'<span class="pill bad">blocked</span>':(n.online?'<span class="pill ok">online</span>':'<span class="pill off">offline</span>');
      const g = n.geo||{};
      const cityLoc = [g.city,g.country].filter(Boolean).join(', ') || '\u2014';
      const hasPos = typeof n.lat==='number' && typeof n.lon==='number';
      const loc = hasPos
        ? `<a target="_blank" rel="noopener noreferrer" title="${esc(T('openMap'))}" href="https://www.openstreetmap.org/?mlat=${n.lat}&amp;mlon=${n.lon}#map=16/${n.lat}/${n.lon}">${esc(n.lat.toFixed(4)+', '+n.lon.toFixed(4))}</a>`
        : esc(cityLoc);
      const mac = esc(n.mac);
      const users = (n.users&&n.users.length)? n.users.map(esc).join(', ') : '<span class="muted">\u2014</span>';
      const wifi = `<span data-wifi="${mac}">${esc(n.ssid||'\u2014')} ${n.wifi_password_set
        ? `<span class="mono">\u2022\u2022\u2022\u2022</span> <button type="button" class="sec" data-act="reveal" data-mac="${mac}">${esc(T('reveal'))}</button>`
        : `<span class="muted">(${esc(T('notSet'))})</span>`}</span>`;
      let cap;
      if(n.capacity_mbps>0){
        const ns=+n.capacity_active_streams||0, ago=fmtAgo(n.capacity_measured_at);
        cap = esc(n.capacity_mbps)+' '+esc(T('mbps'))+' \u00b7 '+esc(ns)+' '+esc(T(ns===1?'stream1':'streamsActive'))+(ago?' \u00b7 '+esc(ago):'');
      } else cap = `<span class="pill warn">${esc(T('unmeasured'))}</span>`;
      const hasSlot = slotPort(n.slot)>0;
      cap = `<div>${cap}</div><button type="button" class="sec" data-act="measure" data-mac="${mac}"${hasSlot?'':' disabled'}>${esc(T('measure'))}</button><div class="err" data-merr="${mac}" role="alert"></div>`;
      const portTxt = (hasSlot ? `<div class="mono muted">${esc(T('slot'))} ${esc(n.slot)} \u00b7 :${esc(slotPort(n.slot))}</div>` : '')
        + (n.slot_mismatch ? `<div><span class="pill warn" title="${esc(T('slotMismatchHint'))}">${esc(T('slotMismatch'))}</span></div>` : '');
      const grp = n.ip_group_size>1 ? `<div><span class="pill off">${esc(T('ipGroup'))} ${esc(n.ip_group||n.remote_ip||'')} (${esc(n.ip_group_size)} ${esc(T('boards'))})</span></div>` : '';
      const full = n.max_users>0 && n.active_users>=n.max_users;
      const nm = `${esc(n.active_users??0)}/${esc(n.max_users??0)}`;
      const nmHtml = full ? `<span class="pill bad">${nm}</span>` : `<span class="muted">${nm}</span>`;
      return `<tr>
        <td>${esc(n.name||'\u2014')}<div class="mono muted">${mac}</div>${portTxt}</td>
        <td>${esc(n.kind||'\u2014')}</td>
        <td>${st}</td>
        <td>${users}<div>${nmHtml}</div>${grp}</td>
        <td>${wifi}</td>
        <td class="mono">${esc(n.remote_ip||'\u2014')}</td>
        <td>${loc}</td>
        <td>${cap}</td>
        <td class="muted">${esc(g.isp||'\u2014')}</td>
        <td>${fmtUptime(n.uptime_sec)}</td>
        <td>\u2191${fmtBytes(n.bytes_up)} \u2193${fmtBytes(n.bytes_down)}</td>
        <td class="mono muted">${esc(n.firmware||'')}${n.pending_ota?' <span class="pill warn">OTA</span>':''}</td>
        <td class="right row-actions">
          <button type="button" data-act="edit" data-mac="${mac}">${esc(T('edit'))}</button>
          <button type="button" class="sec" data-act="ota" data-mac="${mac}">Update FW</button>
          <button type="button" class="sec" data-act="${n.blocked?'allow':'block'}" data-mac="${mac}">${n.blocked?'Allow':'Block'}</button>
          <button type="button" class="danger" data-act="forget" data-mac="${mac}">Forget</button>
        </td></tr>`;
    }).join('');
    $('#dtbl').innerHTML = `<table><thead><tr><th>${esc(T('name'))}</th><th>${esc(T('kind'))}</th><th>Status</th><th>${esc(T('users'))}</th><th>${esc(T('wifi'))}</th><th>Exit IP</th><th>${esc(T('location'))}</th><th>${esc(T('capacity'))}</th><th>ISP</th><th>Uptime</th><th>Traffic</th><th>FW</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    $('#dtbl').querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',()=>{
      const mac=b.dataset.mac, act=b.dataset.act;
      if(act==='edit') openDevice(mac,b);
      else if(act==='measure') measureDevice(mac,b);
      else if(act==='reveal') revealWifi(mac,b);
      else if(act==='ota') otaDevice(mac);
      else devAction(mac,act);
    }));
  }catch(e){ $('#dtbl').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
const measuring = new Set();
async function measureDevice(mac, btn){
  if(measuring.has(mac)) return;
  measuring.add(mac);
  const errEl = [...document.querySelectorAll('#dtbl [data-merr]')].find(x=>x.dataset.merr===mac);
  const label = btn ? btn.textContent : '';
  if(errEl) errEl.textContent='';
  if(btn){ btn.disabled=true; btn.textContent=T('measuring'); }
  try{
    await api('/api/devices/'+encodeURIComponent(mac)+'/measure',{method:'POST'});
    measuring.delete(mac);
    await viewDevices();
  }catch(e){
    measuring.delete(mac);
    if(btn && btn.isConnected){ btn.disabled=false; btn.textContent=label; }
    if(errEl && errEl.isConnected){ errEl.textContent=''; const p=document.createElement('span'); p.className='pill bad'; p.textContent=e.message; errEl.appendChild(p); }
  }
}
function fmtUptime(s){ s=+s||0; if(!s) return '—'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:(h?`${h}h ${m}m`:`${m}m`); }
async function otaDevice(mac){
  const def = localStorage.getItem('ota_url') || (location.protocol+'//'+location.hostname.replace(/^admin\./,'flash.')+'/firmware/esp32_nat_router.bin');
  const url = prompt('Firmware URL to push to '+mac+'\n(the device downloads it over HTTPS and reboots):', def);
  if(!url) return;
  localStorage.setItem('ota_url', url);
  await api('/api/devices/'+encodeURIComponent(mac)+'/ota',{method:'POST',body:JSON.stringify({url})});
  alert('Queued. The device will update on its next connection (within seconds while online).');
  viewDevices();
}
async function devAction(mac,a){ if(a==='forget'&&!confirm('Forget '+mac+'?'))return;
  await api('/api/devices/'+encodeURIComponent(mac)+'/'+a,{method:'POST'}); viewDevices(); }

/* ---- Device editor ---- */
let editDev=null, dmOpener=null;
function openDevice(mac, opener){
  const d = (window._devs||{})[mac]; if(!d) return;
  editDev = d; dmOpener = opener||document.activeElement;
  $('#dmTitle').textContent = T('editDevice')+' '+d.mac;
  $('#dmName').value = d.name||'';
  $('#dmKind').value = d.kind==='dedicated'?'dedicated':'shared';
  $('#dmLat').value = typeof d.lat==='number'?d.lat:''; $('#dmLon').value = typeof d.lon==='number'?d.lon:'';
  $('#dmWifi').value=''; $('#dmWifiHint').textContent = d.wifi_password_set?T('wifiSet'):'';
  $('#dmWifiClear').checked=false; $('#dmWifiClear').disabled=!d.wifi_password_set;
  $('#dmWifiClearLbl').textContent=T('wifiClear');
  $('#dmNotes').value = d.notes||'';
  $('#dmSlot').value = d.slot>0 ? d.slot : ''; updPort();
  $('#dmCancel').textContent=T('cancel'); $('#dmSave').textContent=T('save');
  $('#dmCoordHint').textContent=T('coordHint');
  $('#dmErr').textContent=''; $('#dmodal').style.display='flex';
  $('#app').inert = true;
  $('#dmName').focus();
}
function closeDevice(keepFocus){
  $('#dmodal').style.display='none'; editDev=null;
  $('#app').inert = false;
  if(keepFocus!==true && dmOpener && dmOpener.isConnected) dmOpener.focus();
  dmOpener=null;
}
function slotInput(){ const v=$('#dmSlot').value.trim(); if(v==='') return 0; return /^\d+$/.test(v) ? +v : NaN; }
function updPort(){ const s=slotInput(), p=slotPort(s); $('#dmPort').textContent = T('port')+': '+(p?(':'+p):(s===0?T('noPort'):T('slotInvalid'))); }
$('#dmSlot').addEventListener('input',updPort);
$('#dmCancel').addEventListener('click',closeDevice);
$('#dmSave').addEventListener('click', async ()=>{
  if(!editDev) return;
  // Send only fields that differ from what the modal was opened with.
  const d = editDev, body = {};
  const name=$('#dmName').value.trim(), kind=$('#dmKind').value, notes=$('#dmNotes').value;
  if(name!==(d.name||'')) body.name = name;
  if(kind!==(d.kind==='dedicated'?'dedicated':'shared')) body.kind = kind;
  if(notes!==(d.notes||'')) body.notes = notes;
  const lat=$('#dmLat').value.trim(), lon=$('#dmLon').value.trim();
  if(lat!=='' && +lat!==d.lat) body.lat = +lat;
  if(lon!=='' && +lon!==d.lon) body.lon = +lon;
  const slot=slotInput();
  if(Number.isNaN(slot) || slot>SLOT_MAX){ $('#dmErr').textContent=T('slotInvalid'); return; }
  // a slot the broker does not hold is always re-sent, so Save repairs the drift
  if(slot!==(d.slot>0?d.slot:0) || d.slot_mismatch) body.slot = slot;
  if($('#dmWifiClear').checked) body.wifi_password = '';
  else if($('#dmWifi').value) body.wifi_password = $('#dmWifi').value;
  $('#dmErr').textContent=''; $('#dmSave').disabled=true;
  try{
    await api('/api/devices/'+encodeURIComponent(editDev.mac),{method:'PUT',body:JSON.stringify(body)});
    const mac = editDev.mac;
    closeDevice(true);
    await viewDevices();
    // The table was re-rendered, so the original opener is gone: focus its replacement.
    const nb = [...document.querySelectorAll('#dtbl button[data-act="edit"]')].find(x=>x.dataset.mac===mac);
    if(nb) nb.focus();
  }catch(e){ $('#dmErr').textContent=e.message; }
  finally{ $('#dmSave').disabled=false; }
});
// Reveal the WiFi password for 10 s, then hide it again.
const revealTimers = {};
async function revealWifi(mac, btn){
  const box = btn.closest('[data-wifi]'); if(!box) return;
  const d = (window._devs||{})[mac]||{};
  try{
    const r = await api('/api/devices/'+encodeURIComponent(mac)+'/reveal-wifi',{method:'POST'});
    clearTimeout(revealTimers[mac]);
    const prev = box.innerHTML;
    box.textContent = (d.ssid||'\u2014')+' ';
    const pw = document.createElement('span'); pw.className='mono'; pw.textContent = r.wifi_password || '(empty)';
    box.appendChild(pw);
    revealTimers[mac] = setTimeout(()=>{
      if(!box.isConnected) return;
      box.innerHTML = prev;
      const nb = box.querySelector('button[data-act="reveal"]'); if(nb) nb.addEventListener('click',()=>revealWifi(mac,nb));
    }, 10000);
  }catch(e){ alert(T('revealFailed')+e.message); }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Tab' && $('#dmodal').style.display==='flex'){
    const f=[...$('#dmodal').querySelectorAll('input,select,textarea,button')].filter(x=>!x.disabled);
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    return;
  }
  if(e.key!=='Escape') return;
  if($('#dmodal').style.display==='flex') closeDevice();
  else if($('#umodal').style.display==='flex') closeModal();
});

/* ---- Settings ---- */
function viewSettings(){
  const gostui = $('#gostuiLink').href, flash = $('#flashLink').href;
  const otaUrl = localStorage.getItem('ota_url') || (flash.replace(/\/$/,'')+'/firmware/esp32_nat_router.bin');
  $('#view').innerHTML = `<div class="head"><h2>Settings</h2></div>
    <div class="card" style="max-width:560px">
      <div class="field"><label>Flash firmware page URL</label><input id="setFlash" value="${esc(flash)}" /></div>
      <div class="field"><label>GOST config UI URL</label><input id="setGost" value="${esc(gostui)}" /></div>
      <div class="field"><label>Default OTA firmware URL (used by "Update FW")</label><input id="setOta" value="${esc(otaUrl)}" /></div>
      <button onclick="saveSettings()">Save</button>
      <p class="muted" style="margin-top:16px">Customer proxy endpoint: <span class="mono">this VPS : 3131\u20133160</span> (per-customer slot ports, one per device slot 1\u201330; HTTP &amp; SOCKS5, username/password).<br>
      Legacy pool port: <span class="mono">3128</span> (shared pool across devices).<br>
      Flash new devices at the Flash page — each self-provisions (TLS, token baked in) and appears under <b>Devices</b> by MAC.<br>
      <b>OTA:</b> on the Devices tab, "Update FW" pushes the firmware URL above; the device downloads over HTTPS and reboots.</p>
    </div>`;
}
function saveSettings(){
  localStorage.setItem('gostui',$('#setGost').value.trim()); $('#gostuiLink').href=$('#setGost').value.trim();
  localStorage.setItem('flash',$('#setFlash').value.trim()); $('#flashLink').href=$('#setFlash').value.trim();
  localStorage.setItem('ota_url',$('#setOta').value.trim());
  alert('Saved');
}

/* ---- boot ---- */
if(TOKEN){ api('/api/overview').then(showApp).catch(()=>{ $('#login').style.display='flex'; }); }
else $('#login').style.display='flex';
</script>
